apply:
  - //common.module-template.yaml

settings:
  publishing:
    enabled: true
    group: io.heapy.kotmark
    version: 0.1.0
    # Uses manual release in Central Portal after upload and validation.
    mavenCentral: enabled
    signArtifacts: true
    publishSources: true
    pom:
      url: https://github.com/Heapy/kotmark
      scm: https://github.com/Heapy/kotmark.git
      developers:
        - id: IRus
          name: Ruslan Ibrahimau
          url: https://github.com/IRus
      licenses:
        - name: Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt

plugins:
  bcv:
    enabled: true
    # These targets are not supported by BCV 0.2.1; their tests/builds remain in CI.
    excludedTargets: [android, watchosDeviceArm64]
  dokka:
    enabled: true
    documentedVisibilities: [public, protected]
  kover:
    enabled: true
    # Establish reports before choosing a coverage policy.
    minimumLineCoverage: 0
