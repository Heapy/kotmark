name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: '1'

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android unit tests
            os: ubuntu-24.04
            platforms: android
            mode: ktc
          - name: Linux x64 tests
            os: ubuntu-24.04
            platforms: linuxX64
            mode: ktc
          - name: Windows Native tests
            os: windows-2025
            platforms: mingwX64
            mode: ktc
          - name: macOS ARM64 tests
            os: macos-26
            platforms: macosArm64
            mode: ktc
          - name: iOS ARM64 simulator tests
            os: macos-26
            platforms: iosSimulatorArm64
            mode: ktc
          - name: Wasm JS browser tests
            os: ubuntu-24.04
            platforms: wasmJs
            mode: ktc
          - name: JavaScript tests
            os: ubuntu-24.04
            platforms: js
            mode: js
          - name: Wasm WASI tests
            os: ubuntu-24.04
            platforms: wasmWasi
            mode: additional
          - name: tvOS simulator tests
            os: macos-26
            platforms: tvosSimulatorArm64
            mode: additional
          - name: watchOS simulator tests
            os: macos-26
            platforms: watchosSimulatorArm64
            mode: additional
          # Device binaries cannot execute on hosted runners. Check compilation
          # explicitly rather than passing these targets to a host test runner.
          - name: Apple device compilation
            os: macos-26
            platforms: iosArm64 tvosArm64 watchosArm64 watchosDeviceArm64
            mode: build

    defaults:
      run:
        shell: bash
    env:
      KOTLIN_CLI_NO_WELCOME_BANNER: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore locked build plugins
        uses: Heapy/setup-ktc-plugins@5de74f161cb07ad74e72ee28bfad228f4cce3bb4 # v1.0.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Set up Kotlin Toolchain
        uses: Heapy/setup-ktc@cc63216665ce07ce0709fe52ef4a4b0b63aeaddc # v1.1.0
        with:
          version: auto
          # One cache writer per runner OS; other jobs reuse the same downloads.
          cache-read-only: ${{ contains(fromJSON('["linuxX64", "macosArm64", "mingwX64"]'), matrix.platforms) && 'auto' || 'true' }}

      - name: Select test modules
        id: modules
        if: matrix.mode == 'ktc'
        env:
          TEST_PLATFORM: ${{ matrix.platforms }}
        run: echo "names=$(node scripts/ci-model.mjs tests "$TEST_PLATFORM")" >> "$GITHUB_OUTPUT"

      - name: Build and test
        if: matrix.mode == 'ktc'
        uses: Heapy/ktc-check@4c3cbb954ad568dcea63d7fbfa9f52b3f8aa3dc3 # v1.1.1
        with:
          checks: tests
          build: false
          modules: ${{ steps.modules.outputs.names }}
          platforms: ${{ matrix.platforms }}
          command-timeout-minutes: 40
          artifact-name: tests-${{ strategy.job-index }}

      - name: Run JavaScript tests
        if: matrix.mode == 'js'
        run: node scripts/test-js.mjs

      - name: Run additional platform tests
        if: matrix.mode == 'additional'
        env:
          TEST_PLATFORM: ${{ matrix.platforms }}
        run: node scripts/test-additional-platforms.mjs "$TEST_PLATFORM"

      - name: Compile Apple device production and test sources
        if: matrix.mode == 'build'
        env:
          BUILD_PLATFORMS: ${{ matrix.platforms }}
        run: |
          read -r -a platforms <<< "$BUILD_PLATFORMS"
          node scripts/test-additional-platforms.mjs --compile-only "${platforms[@]}"

  jvm-quality:
    name: JVM coverage and benchmark smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Heapy/setup-ktc-plugins@5de74f161cb07ad74e72ee28bfad228f4cce3bb4 # v1.0.0
      - uses: Heapy/setup-ktc@cc63216665ce07ce0709fe52ef4a4b0b63aeaddc # v1.1.0
        with:
          version: auto
          cache-read-only: 'true'
      - uses: Heapy/setup-main-kts@b0858237748f325b825e752bbac2ec2eb1fb9419 # v1.0.1
        with:
          kotlin-version: '2.4.21'
          java-version: '25'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check CI orchestration
        run: node --test scripts/test/*.test.mjs
      - name: Check generated emoji dictionary
        run: node scripts/generate-emoji.mjs --check
      - name: Run library JVM tests with coverage
        run: kotlinr plugins/kover/coverage.main.kts
      - name: Run fixture and integration JVM tests
        run: ./kotlin test --platform jvm -m test-fixtures -m integration-test
      - name: Check benchmark integration
        run: ./kotlin 'do' benchmarkSmoke -m benchmark-jvm
      - name: Package reusable coverage reports
        run: tar -cf build/coverage.tar build/tasks/*_koverReport@kover/html build/tasks/*_koverReport@kover/coverage.xml
      - name: Upload site coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-coverage
          path: build/coverage.tar
          if-no-files-found: error
          retention-days: 7
      - name: Upload coverage, tests, and benchmark smoke reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jvm-quality-reports
          path: |
            build/reports/
            build/tasks/*_koverReport@kover/html/
            build/tasks/*_koverReport@kover/coverage.xml
            build/tasks/*_koverPrepare@kover/test-results/
            build/tasks/_benchmark-jvm_benchmarkSmoke@benchmark/*.json

  fuzz:
    name: Coverage-guided fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore locked build plugins when configured
        if: hashFiles('ktc-plugins.lock.yaml') != ''
        uses: Heapy/setup-ktc-plugins@5de74f161cb07ad74e72ee28bfad228f4cce3bb4 # v1.0.0
      - uses: Heapy/setup-ktc@cc63216665ce07ce0709fe52ef4a4b0b63aeaddc # v1.1.0
        with:
          version: auto
          cache-read-only: 'true'
      - name: Run coverage-guided fuzz smoke test
        run: ./kotlin run -m fuzz --jvm-args="-Xmx1024m -Xss4m" -- -max_total_time=60 -seed=1 build/fuzz/corpus
      - name: Upload fuzz corpus and crash artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: build/fuzz/

  linux-arm64-tests:
    name: Linux ARM64 tests
    needs: linux-arm64-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Download Linux ARM64 test executables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-arm64-test-executables
          path: build/tasks

      - name: Run Linux ARM64 tests
        shell: bash
        run: |
          shopt -s nullglob
          tests=(build/tasks/_*_linkLinuxArm64TestDebug/*_test.kexe)
          if (( ${#tests[@]} == 0 )); then
            echo 'No Linux ARM64 test executables found' >&2
            exit 1
          fi
          for executable in "${tests[@]}"; do
            chmod +x "$executable"
            "$executable"
          done

  api:
    name: API (${{ matrix.id }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: jvm-web, os: ubuntu-24.04, targets: 'jvm,js,wasmJs,wasmWasi' }
          - { id: linux, os: ubuntu-24.04, targets: 'linuxX64,linuxArm64' }
          - { id: windows, os: windows-2025, targets: 'mingwX64' }
          - { id: macos-ios, os: macos-26, targets: 'macosArm64,iosArm64,iosSimulatorArm64' }
          - { id: tvos-watchos, os: macos-26, targets: 'tvosArm64,tvosSimulatorArm64,watchosArm64,watchosSimulatorArm64' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Heapy/setup-ktc-plugins@5de74f161cb07ad74e72ee28bfad228f4cce3bb4 # v1.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: Heapy/setup-ktc@cc63216665ce07ce0709fe52ef4a4b0b63aeaddc # v1.1.0
        with:
          version: auto
          cache-read-only: 'true'
      - name: Compile once and check ABI
        env:
          ABI_TARGETS: ${{ matrix.targets }}
        run: node scripts/library-tools.mjs api-check --targets "$ABI_TARGETS"
      - name: Upload ABI diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-${{ matrix.id }}
          path: |
            build/reports/ci/
            build/tasks/*_abiPlan@bcv/*.log
            build/tasks/*_apiBuild@bcv/*.log
            build/tasks/*_apiBuild@bcv/*.api
            build/tasks/*_klibApiBuild@bcv/*.log
            build/tasks/*_klibApiBuild@bcv/*.api
          retention-days: 7

  linux-arm64-build:
    name: Linux ARM64 cross compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Heapy/setup-ktc-plugins@5de74f161cb07ad74e72ee28bfad228f4cce3bb4 # v1.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: Heapy/setup-ktc@cc63216665ce07ce0709fe52ef4a4b0b63aeaddc # v1.1.0
        with:
          version: auto
          cache-read-only: 'true'
      - name: Link Linux ARM64 test executables
        run: node scripts/test-additional-platforms.mjs --link-only linuxArm64
      - name: Upload Linux ARM64 test executables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-arm64-test-executables
          path: build/tasks/_*_linkLinuxArm64TestDebug/*_test.kexe
          if-no-files-found: error
          retention-days: 1

  documentation-validate:
    name: Validate documentation and examples
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore locked build plugins
        uses: Heapy/setup-ktc-plugins@5de74f161cb07ad74e72ee28bfad228f4cce3bb4 # v1.0.0
      - name: Set up Kotlin Toolchain
        uses: Heapy/setup-ktc@cc63216665ce07ce0709fe52ef4a4b0b63aeaddc # v1.1.0
        with:
          version: auto
          cache-read-only: 'true'
      - name: Set up Kotlin scripting
        uses: Heapy/setup-main-kts@b0858237748f325b825e752bbac2ec2eb1fb9419 # v1.0.1
        with:
          kotlin-version: '2.4.21'
          java-version: '25'
      - name: Compile and test the site builder and examples
        run: ./kotlin test --platform jvm -m examples -m site-builder
      - name: Generate Markdown pages
        run: ./kotlin run --platform jvm -m site-builder
      - name: Check links and source-backed snippets
        run: kotlinr docs/check.main.kts

      - name: Package generated pages
        run: tar -cf build/site.tar build/site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-static
          path: build/site.tar
          if-no-files-found: error
          retention-days: 7

  documentation-api:
    name: API documentation (${{ matrix.shard }}/3)
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Heapy/setup-ktc-plugins@5de74f161cb07ad74e72ee28bfad228f4cce3bb4 # v1.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: Heapy/setup-ktc@cc63216665ce07ce0709fe52ef4a4b0b63aeaddc # v1.1.0
        with:
          version: auto
          cache-read-only: 'true'
      - name: Generate API pages with shared dependency compilation
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/documentation.mjs "$SHARD/3"
      - name: Package API pages
        env:
          SHARD: ${{ matrix.shard }}
        run: tar -cf "build/api-$SHARD.tar" build/documentation/tasks/*_dokkaHtml@dokka/html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-api-${{ matrix.shard }}
          path: build/api-${{ matrix.shard }}.tar
          if-no-files-found: error
          retention-days: 7
      - name: Upload documentation timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-diagnostics-${{ matrix.shard }}
          path: build/reports/ci/
          retention-days: 7

  pages:
    name: Assemble documentation site
    if: github.event_name != 'pull_request'
    needs: [documentation-validate, documentation-api, jvm-quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Heapy/setup-main-kts@b0858237748f325b825e752bbac2ec2eb1fb9419 # v1.0.1
        with:
          kotlin-version: '2.4.21'
          java-version: '25'
      - name: Download reports from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: site-*
          merge-multiple: true
          path: build/site-inputs
      - name: Assemble and validate all modules
        run: |
          for archive in build/site-inputs/*.tar; do tar -xf "$archive"; done
          kotlinr docs/assemble.main.kts
          kotlinr docs/check.main.kts --assembled build/pages
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/pages

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: pages
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
