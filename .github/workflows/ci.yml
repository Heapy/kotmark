name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-tests:
    name: JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Cache Kotlin Toolchain
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml') }}
          restore-keys: |
            kotlin-toolchain-${{ runner.os }}-

      - name: Run JVM tests
        env:
          KOTLIN_CLI_NO_WELCOME_BANNER: "1"
        run: ./kotlin test --platform jvm
