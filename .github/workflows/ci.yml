name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Native API checks compile library artifacts in addition to the platform suite.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android unit tests
            os: ubuntu-24.04
            platforms: android
            mode: ktc
          - name: Linux x64 tests
            os: ubuntu-24.04
            platforms: linuxX64
            mode: ktc
          - name: Linux ARM64 cross compilation
            os: ubuntu-24.04
            platforms: linuxArm64
            mode: native-cross
          - name: Windows Native tests
            os: windows-2025
            platforms: mingwX64
            mode: ktc
          - name: macOS and iOS ARM64 simulator tests
            os: macos-26
            platforms: macosArm64 iosSimulatorArm64
            mode: ktc
          - name: Wasm JS browser tests
            os: ubuntu-24.04
            platforms: wasmJs
            mode: ktc
          - name: JavaScript tests
            os: ubuntu-24.04
            platforms: js
            mode: js
          - name: Wasm WASI tests
            os: ubuntu-24.04
            platforms: wasmWasi
            mode: additional
          - name: tvOS simulator tests
            os: macos-26
            platforms: tvosSimulatorArm64
            mode: additional
          - name: watchOS simulator tests
            os: macos-26
            platforms: watchosSimulatorArm64
            mode: additional
          # Device binaries cannot execute on hosted runners. Check compilation
          # explicitly rather than passing these targets to a host test runner.
          - name: Apple device compilation
            os: macos-26
            platforms: iosArm64 tvosArm64 watchosArm64 watchosDeviceArm64
            mode: build

    defaults:
      run:
        shell: bash
    env:
      KOTLIN_CLI_NO_WELCOME_BANNER: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore locked build plugins
        uses: Heapy/setup-ktc-plugins@5de74f161cb07ad74e72ee28bfad228f4cce3bb4 # v1.0.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Set up Kotlin Toolchain
        uses: Heapy/setup-ktc@cc63216665ce07ce0709fe52ef4a4b0b63aeaddc # v1.1.0
        with:
          version: auto

      - name: Build and test
        if: matrix.mode == 'ktc'
        uses: Heapy/ktc-check@4c3cbb954ad568dcea63d7fbfa9f52b3f8aa3dc3 # v1.1.1
        with:
          checks: tests
          platforms: ${{ matrix.platforms }}
          command-timeout-minutes: 40
          artifact-name: tests-${{ strategy.job-index }}

      - name: Run JavaScript tests
        if: matrix.mode == 'js'
        run: node scripts/test-js.mjs

      - name: Check public API baselines
        if: matrix.platforms == 'linuxX64' || matrix.platforms == 'mingwX64' || matrix.platforms == 'macosArm64 iosSimulatorArm64'
        run: node scripts/library-tools.mjs api-check

      - name: Run additional platform tests
        if: matrix.mode == 'additional'
        env:
          TEST_PLATFORM: ${{ matrix.platforms }}
        run: node scripts/test-additional-platforms.mjs "$TEST_PLATFORM"

      # Kotlin/Native has no Linux ARM64 compiler distribution. Cross-compile
      # on x64, then execute these binaries in the ARM64 job below.
      - name: Link Linux ARM64 test executables
        if: matrix.mode == 'native-cross'
        run: node scripts/test-additional-platforms.mjs --link-only linuxArm64

      - name: Upload Linux ARM64 test executables
        if: matrix.mode == 'native-cross'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-arm64-test-executables
          path: build/tasks/_*_linkLinuxArm64TestDebug/*_test.kexe
          if-no-files-found: error
          retention-days: 1

      - name: Compile Apple device production and test sources
        if: matrix.mode == 'build'
        env:
          BUILD_PLATFORMS: ${{ matrix.platforms }}
        run: |
          read -r -a platforms <<< "$BUILD_PLATFORMS"
          node scripts/test-additional-platforms.mjs --compile-only "${platforms[@]}"

  jvm-quality:
    name: JVM coverage and benchmark smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Heapy/setup-ktc-plugins@5de74f161cb07ad74e72ee28bfad228f4cce3bb4 # v1.0.0
      - uses: Heapy/setup-ktc@cc63216665ce07ce0709fe52ef4a4b0b63aeaddc # v1.1.0
        with:
          version: auto
      - uses: Heapy/setup-main-kts@b0858237748f325b825e752bbac2ec2eb1fb9419 # v1.0.1
        with:
          kotlin-version: '2.4.21'
          java-version: '25'
      - name: Run library JVM tests with coverage
        run: kotlinr plugins/kover/coverage.main.kts
      - name: Run fixture and integration JVM tests
        run: ./kotlin test --platform jvm -m test-fixtures -m integration-test
      - name: Check benchmark integration
        run: ./kotlin 'do' benchmarkSmoke -m benchmark-jvm
      - name: Upload coverage, tests, and benchmark smoke reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jvm-quality-reports
          path: |
            build/reports/
            build/tasks/*_koverReport@kover/html/
            build/tasks/*_koverReport@kover/coverage.xml
            build/tasks/*_koverPrepare@kover/test-results/
            build/tasks/_benchmark-jvm_benchmarkSmoke@benchmark/*.json

  documentation:
    name: Generate API documentation
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Heapy/setup-ktc-plugins@5de74f161cb07ad74e72ee28bfad228f4cce3bb4 # v1.0.0
      - uses: Heapy/setup-ktc@cc63216665ce07ce0709fe52ef4a4b0b63aeaddc # v1.1.0
        with:
          version: auto
      - name: Generate API documentation
        run: |
          for module in autolink kotmark kotmark-ext-* kotmark-renderer-kotlinx-html; do
            ./kotlin do dokkaHtml -m "$module" --build-dir build/documentation
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-documentation
          path: build/documentation/tasks/*_dokkaHtml@dokka/html/
          if-no-files-found: error

  fuzz:
    name: Coverage-guided fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore locked build plugins when configured
        if: hashFiles('ktc-plugins.lock.yaml') != ''
        uses: Heapy/setup-ktc-plugins@5de74f161cb07ad74e72ee28bfad228f4cce3bb4 # v1.0.0
      - uses: Heapy/setup-ktc@cc63216665ce07ce0709fe52ef4a4b0b63aeaddc # v1.1.0
        with:
          version: auto
      - name: Run coverage-guided fuzz smoke test
        run: ./kotlin run -m fuzz --jvm-args="-Xmx1024m -Xss4m" -- -max_total_time=60 -seed=1 build/fuzz/corpus
      - name: Upload fuzz corpus and crash artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: build/fuzz/

  linux-arm64-tests:
    name: Linux ARM64 tests
    needs: tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Download Linux ARM64 test executables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-arm64-test-executables
          path: build/tasks

      - name: Run Linux ARM64 tests
        shell: bash
        run: |
          shopt -s nullglob
          tests=(build/tasks/_*_linkLinuxArm64TestDebug/*_test.kexe)
          if (( ${#tests[@]} == 0 )); then
            echo 'No Linux ARM64 test executables found' >&2
            exit 1
          fi
          for executable in "${tests[@]}"; do
            chmod +x "$executable"
            "$executable"
          done
