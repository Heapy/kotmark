name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: JVM and Linux Native tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Check out commonmark-java fixtures
        uses: actions/checkout@v7.0.1
        with:
          repository: commonmark/commonmark-java
          ref: 9477a93b6b0965efc54c55bd40ad88fbbe25bc6f
          path: projects/commonmark-java

      - name: Check out CommonMark specification
        uses: actions/checkout@v7.0.1
        with:
          repository: commonmark/commonmark-spec
          ref: 3da939428d80f146f270cd1765e4ba462e96bb1b
          path: projects/commonmark-spec

      - name: Cache Kotlin Toolchain
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', '*.module-template.yaml') }}
          restore-keys: |
            kotlin-toolchain-${{ runner.os }}-

      - name: Run JVM and Linux Native tests
        env:
          KOTLIN_CLI_NO_WELCOME_BANNER: "1"
        run: ./kotlin test --platform jvm --platform linuxX64 --jvm-args=-Xss4m

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run JavaScript tests
        run: node scripts/test-js.mjs
