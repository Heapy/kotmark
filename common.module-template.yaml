settings:
  kotlin:
    version: 2.4.21
    languageVersion: 2.4
    apiVersion: 2.4
    freeCompilerArgs:
      - -Xreturn-value-checker=full
      - -Xname-based-destructuring=complete
  jvm:
    jdk:
      version: 17
    release: 17
    test:
      # Deeply nested Markdown fixtures need more than the default thread stack.
      freeJvmArgs: [-Xss4m]

settings@android:
  android:
    minSdk: 24
    compileSdk: 37

test-settings@mingwX64:
  kotlin:
    # Pathological nesting fixtures need a larger stack in Windows test binaries.
    linkerOptions: ["-Wl,--stack,16777216"]
